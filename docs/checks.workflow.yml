name: checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_ui.cjs
      - run: python scripts/configure.py && docker compose config --quiet
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendor/go-music-dl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: vendor/go-music-dl/go.mod
          cache-dependency-path: vendor/go-music-dl/go.sum
      - run: go test ./internal/web -run 'TestHubInternalToken|TestAllowSaveLocal|TestAuth' -count=1
      - run: go build ./cmd/music-dl
