name: music-hub
services:
  hub:
    image: ${MUSIC_HUB_IMAGE:-ioaoleo/music-hub:latest}
    restart: unless-stopped
    stop_grace_period: 35s
    ports:
      - "${HUB_BIND_ADDRESS:-0.0.0.0}:${HUB_PORT:-9985}:8000"
    environment:
      HUB_AUTH_REQUIRED: ${HUB_AUTH_REQUIRED:-true}
      HUB_COOKIE_SECURE: ${HUB_COOKIE_SECURE:-false}
      HUB_USER: ${HUB_USER:-admin}
      HUB_PASSWORD: ${HUB_PASSWORD:-}
      HUB_ENGINE_TOKEN: ${HUB_ENGINE_TOKEN:-}
      HUB_MUSIC_HOST_PATH: ${ENGINE_DOWNLOAD_PATH:-./data/music}
      TZ: Asia/Shanghai
    volumes:
      - ${HUB_TASKS_PATH:-hub_tasks}:/data/tasks
      - ${ENGINE_DATA_PATH:-engine_data}:/data/engine
      - ${ENGINE_DOWNLOAD_PATH:-./data/music}:/music
      - hub_config:/shared
volumes:
  hub_tasks:
  engine_data:
  hub_config:
