name: music-hub
services:
  hub:
    build: .
    restart: unless-stopped
    ports:
      - "${HUB_BIND_ADDRESS:-0.0.0.0}:${HUB_PORT:-9985}:8000"
    environment:
      HUB_DATA_DIR: /data/tasks
      HUB_ENGINE_URL: http://engine:9981
      HUB_ENGINE_TOKEN: ${HUB_ENGINE_TOKEN:?请先运行 scripts/configure.py}
      HUB_AUTH_REQUIRED: ${HUB_AUTH_REQUIRED:-true}
      HUB_USER: ${HUB_USER:-admin}
      HUB_PASSWORD: ${HUB_PASSWORD:?请先配置 HUB_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - ${HUB_TASKS_PATH:-./data/tasks}:/data/tasks
    depends_on:
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD","python","-c","import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=5)"]
      interval: 30s
      timeout: 8s
      start_period: 30s
      retries: 3
  engine:
    build:
      context: ./vendor/go-music-dl
      dockerfile: Dockerfile.hub
      args:
        GOPROXY: ${ENGINE_GOPROXY:-https://proxy.golang.org,direct}
        APK_MIRROR: ${ENGINE_APK_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: unless-stopped
    environment:
      ENGINE_INTERNAL_TOKEN: ${HUB_ENGINE_TOKEN:?请先运行 scripts/configure.py}
      MUSIC_DL_CONFIG_DB: /home/appuser/data/settings.db
      MUSIC_DL_FAVORITES_DB: /home/appuser/data/favorites.db
      TZ: Asia/Shanghai
    volumes:
      - ${ENGINE_DATA_PATH:-./data/engine}:/home/appuser/data
      - ${ENGINE_DOWNLOAD_PATH:-./data/music}:/music
    expose: ["9981"]
    healthcheck:
      test: ["CMD","wget","-q","-O","/dev/null","http://127.0.0.1:9981/music/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4
