<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · Music Hub</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f8fa;color:#303034;font:14px/1.65 system-ui,"Microsoft YaHei",sans-serif;min-height:100vh;display:grid;place-items:center;padding:28px}.shell{width:min(100%,1020px);display:grid;grid-template-columns:1fr 1fr;background:white;border:1px solid #ececf0;border-radius:24px;overflow:hidden;box-shadow:0 20px 90px #2420340a}.story{padding:46px;background:linear-gradient(150deg,#fff0ef,#fff9f8);position:relative;overflow:hidden}.brand{font-weight:750;font-size:23px;letter-spacing:-.6px;display:flex;align-items:center;gap:10px}.mark{width:38px;height:38px;background:#ec4141;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:26px}.eyebrow{font-size:10px;letter-spacing:3px;color:#c37070;margin-top:68px}.story h1{font-size:34px;line-height:1.5;margin:14px 0;color:#382a2e}.story p{color:#a27c80}.record{width:190px;height:190px;margin:38px auto;background:repeating-radial-gradient(circle,#28272d 0 3px,#39383e 4px 5px);border-radius:50%;display:grid;place-items:center;box-shadow:0 18px 35px #622e2e20;transform:rotate(-15deg)}.record:after{content:'♪';display:grid;place-items:center;width:70px;height:70px;border:9px solid #f9a1a1;background:#ec4141;border-radius:50%;color:white;font-size:38px}.note{font-size:11px;color:#b58e91}.form{padding:55px 48px}.step{font-size:11px;color:#ec4141;letter-spacing:2px;font-weight:600}.form h2{font-size:27px;margin:12px 0 6px;letter-spacing:-.7px}.subtitle{color:#98989f;font-size:13px;margin:0 0 28px}.field{margin-bottom:18px}label{display:block;font-size:13px;margin-bottom:7px}input{width:100%;font:inherit;padding:12px 14px;border:1px solid #e2e2e8;border-radius:10px;outline:none;background:#fff}input:focus{border-color:#ec4141;box-shadow:0 0 0 3px #ec414110}input[readonly]{background:#fafafa;color:#999}small{color:#aaa;font-size:11px}.show{display:flex;align-items:center;gap:7px;color:#888;font-size:12px;margin:0 0 20px}.show input{width:auto}.primary{background:#ec4141;border:0;border-radius:22px;color:white;font:inherit;font-weight:600;cursor:pointer;width:100%;padding:12px;margin-top:2px}.primary:disabled{opacity:.5;cursor:wait}.error{color:#cc3d3d;min-height:26px;font-size:12px;margin:15px 0 0;overflow-wrap:anywhere}.foot{font-size:11px;color:#aaa;border-top:1px solid #f0f0f3;padding-top:20px;margin-top:18px}a{color:#b16e6e}button:focus-visible,a:focus-visible{outline:2px solid #ec4141;outline-offset:4px}[hidden]{display:none!important}@media(max-width:700px){body{padding:16px}.shell{display:block;max-width:450px}.story{padding:23px 26px}.story h1,.story p,.record,.eyebrow,.note{display:none}.brand{font-size:21px}.form{padding:30px 26px}.form h2{font-size:25px}}
</style></head><body><main class="shell"><section class="story"><div class="brand"><span class="mark">♪</span>Music Hub</div><div class="eyebrow">YOUR PERSONAL MUSIC SPACE</div><h1>好音乐，<br>值得好好收藏。</h1><p>发现、下载、整理。<br>让喜欢的旋律，住进自己的音乐库。</p><div class="record" aria-hidden="true"></div><div class="note">属于你的音乐空间 · 数据保存在自己的设备</div></section><section class="form"><div id="step" class="step">WELCOME BACK</div><h2 id="title">登录你的音乐空间</h2><p id="subtitle" class="subtitle">正在连接设备…</p><form id="authForm"><div class="field"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" maxlength="64" required></div><div class="field" id="oldField" hidden><label for="oldPassword">当前密码</label><input id="oldPassword" name="old_password" type="password" autocomplete="current-password" maxlength="128"></div><div class="field"><label id="passwordLabel" for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required><small id="passwordHelp" hidden>至少 10 位，最长 128 位。请勿使用平台 Token 作为登录密码。</small></div><div class="field" id="confirmField" hidden><label for="confirmation">确认密码</label><input id="confirmation" type="password" autocomplete="new-password" maxlength="128"></div><label class="show"><input id="showPassword" type="checkbox">显示密码</label><button class="primary" id="submit" disabled>登录</button><div id="error" class="error" role="status" aria-live="polite"></div></form><div class="foot" id="foot">登录后即可管理搜索、批量下载与音乐目录。</div></section></main>
<script>
const el=id=>document.getElementById(id);let mode='login',csrf='';
async function initialize(){try{const r=await fetch('/api/auth/status');const d=await r.json();if(!r.ok)throw Error('连接失败');csrf=d.csrf;
 if(!d.auth_required){location.replace('/');return}
 if(!d.configured){mode='setup';el('step').textContent='FIRST TIME · 01 / 02';el('title').textContent='创建你的音乐空间';el('subtitle').textContent='首次使用，请先创建管理员账号和密码。';el('submit').textContent='创建管理员，继续';el('username').value='admin';el('foot').textContent='下一步：确认音乐目录映射与写入权限，按需设置平台 Cookie。'}
 else if(d.authenticated&&(d.change_required||location.pathname==='/setup')){mode='password';el('step').textContent='ACCOUNT SECURITY';el('title').textContent='设置自己的密码';el('subtitle').textContent=d.change_required?'检测到旧版账号，请设置自己的新密码后继续。':'修改密码后，其他设备的登录会失效。';el('username').value=d.username;el('username').readOnly=true;el('oldField').hidden=false;el('oldPassword').required=true;el('submit').textContent='保存新密码';el('passwordLabel').textContent='新密码'}
 else if(d.authenticated){location.replace('/');return}
 else{el('subtitle').textContent='欢迎回来，继续发现喜欢的音乐。'}
 if(mode!=='login'){el('confirmField').hidden=false;el('confirmation').required=true;el('passwordHelp').hidden=false;el('password').minLength=10;el('password').autocomplete='new-password'}
 el('submit').disabled=false;
 }catch(e){el('subtitle').textContent='设备暂时无法连接，请刷新页面重试。'}}
el('showPassword').onchange=e=>{['password','confirmation','oldPassword'].forEach(k=>el(k).type=e.target.checked?'text':'password')};
el('authForm').onsubmit=async event=>{event.preventDefault();el('error').textContent='';if(mode!=='login'&&el('password').value!==el('confirmation').value){el('error').textContent='两次输入的密码不一致';return}el('submit').disabled=true;try{const path=mode==='setup'?'setup':mode==='password'?'password':'login';const response=await fetch('/api/auth/'+path,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({username:el('username').value.trim(),password:el('password').value,confirmation:el('confirmation').value,old_password:el('oldPassword').value})});const d=await response.json();if(!response.ok||!d.ok)throw Error(d.msg||'操作失败');location.replace(d.change_required?'/setup':mode==='login'?'/':'/?welcome=1')}catch(e){el('error').textContent=e.message;el('submit').disabled=false}};
initialize();
</script></body></html>
